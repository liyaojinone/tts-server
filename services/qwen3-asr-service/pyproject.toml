[project]
name = "qwen3-asr-service"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn", "pydantic"]

[project.optional-dependencies]
asr = ["qwen-asr"]
aligner = [
  "accelerate>=1.12,<2",
  "librosa>=0.11,<1",
  "soundfile>=0.13,<1",
  "transformers>=5.13,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
