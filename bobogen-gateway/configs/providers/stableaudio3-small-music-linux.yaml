provider_id: stable_audio_3_small_music
model_id: stable_audio_3_small_music
provider_type: stableaudio3
display_name: Stable Audio 3 Small-Music
enabled: true
tasks:
  - audio.generate
runtime:
  root_dir: ${BOBOGEN_ROOT}/services/stable-audio3-service
  cwd: ${BOBOGEN_ROOT}/services/stable-audio3-service
  command:
    - bash
    - ${BOBOGEN_ROOT}/services/stable-audio3-service/start.sh
  env:
    STABLE_AUDIO3_REPO_DIR: ${BOBOGEN_ROOT}/models/stable-audio-3/repo
    STABLE_AUDIO3_MODEL_ID: stable_audio_3_small_music
    STABLE_AUDIO3_MODEL_NAME: small-music
    STABLE_AUDIO3_HF_REPO_ID: stabilityai/stable-audio-3-small-music
    STABLE_AUDIO3_PORT: "5108"
  startup_timeout_ms: 120000
  request_timeout_ms: 180000
  idle_shutdown_seconds: 0
network:
  host: 127.0.0.1
  port: 5108
  base_url: http://127.0.0.1:5108
  healthcheck_path: /v1/health
capabilities:
  voices: false
  synthesize: false
  clone: false
  stream: false
voices: []
