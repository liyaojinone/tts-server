provider_id: cosyvoice2
model_id: cosyvoice2
provider_type: cosyvoice
display_name: CosyVoice2
enabled: true
runtime:
  root_dir: ${BOBOGEN_ROOT}\services\cosyvoice-service
  cwd: ${BOBOGEN_ROOT}\services\cosyvoice-service
  command:
    - powershell
    - -File
    - ${BOBOGEN_ROOT}\services\cosyvoice-service\start.ps1
  env:
    COSYVOICE_MODEL_ID: cosyvoice2
    COSYVOICE_REPO_DIR: "${BOBOGEN_ROOT}\\models\\cosyvoice\\repo"
    COSYVOICE_PROFILE_DIR: "${BOBOGEN_ROOT}\\services\\cosyvoice-service\\data\\profiles\\cosyvoice2"
    COSYVOICE_PORT: "5101"
  startup_timeout_ms: 120000
  request_timeout_ms: 180000
  idle_shutdown_seconds: 0
network:
  host: 127.0.0.1
  port: 5101
  base_url: http://127.0.0.1:5101
  healthcheck_path: /v1/health
capabilities:
  voices: true
  synthesize: true
  clone: true
  stream: false
voices:
  - voice_id: clone
    name: Zero-shot Clone
    language: [zh, en, ja, yue, ko]
    description: CosyVoice2 官方零样本参考音频克隆
    tags: [reference, clone]
    metadata:
      mode: zero_shot
