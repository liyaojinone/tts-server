[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bobogen-gateway"
version = "0.1.0"
description = "Unified BoboGen Gateway for CosyVoice, F5-TTS, and GPT-SoVITS"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "httpx",
  "huggingface_hub",
    "mcp<2",
  "modelscope",
  "pydantic",
  "python-multipart",
  "pyyaml",
  "uvicorn",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
